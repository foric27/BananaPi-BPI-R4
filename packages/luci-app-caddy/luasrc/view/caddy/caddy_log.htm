<style>
:root { --bg:#ffffff; --card:#f6f8fa; --text:#222; --border:#ddd; --muted:#666; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#1b1e24; --text:#e5e7eb; --border:#333; --muted:#9ca3af; } }
body { background:var(--bg); color:var(--text); margin:0; }

#app { all: unset; display:block; width:100%; padding:12px; font-family:system-ui,-apple-system; text-align:left; }
.toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.toolbar select { margin-left:4px; }

button { border-radius:6px; padding:6px 10px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease; }
button:active { transform: scale(0.95); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); background: rgba(0,0,0,0.05); }
button.toggle-btn { background:#d0a026; color:#fff; border:none; }
button.clear-log { background:#e74c3c; color:#fff; border:none; }
button.view-json { background:#60a5fa; color:#fff; border:none; }

.log-card { all: unset; display:block; width:100%; padding:12px; margin-bottom:12px; background:var(--card); border-radius:10px; text-align:left; box-sizing:border-box; overflow:hidden; border-width:2px; border-style:solid; border-left-color:#888; }
.log-card.ok { border-color:#2ecc71; }
.log-card.warn { border-color:#f39c12; }
.log-card.err { border-color:#e74c3c; }

.log-inner { all: unset; display:block; width:100%; text-align:left; overflow-wrap:break-word; word-break:break-word; }
.log-row { all: unset; display:flex; width:100%; font-size:13px; line-height:1.8; word-break:break-all; margin-bottom:2px; text-align:left; align-items:flex-start; }
.log-row .label { all: unset; flex-shrink:0; color:var(--muted); margin-right:8px; }
.log-row a { color:#2563eb; text-decoration:underline; font-size:13px; }

.modal { display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background-color: rgba(0,0,0,0.5); justify-content:center; align-items:center; overflow:auto; }
.modal.show { display:flex; }
.modal-content { background:#fff; border-radius:6px; max-width:700px; width:80%; max-height:70vh; overflow:auto; white-space: pre; position:relative; display:flex; flex-direction:column; }

.modal-header { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; border-bottom:1px solid #ccc; background:#f3f3f3; border-top-left-radius:6px; border-top-right-radius:6px; flex-shrink:0; }
.modal-header h3 { margin:0; font-size:16px; }
.modal-close { padding:4px 8px; border:none; border-radius:6px; background:#393fec; color:#fff; cursor:pointer; }

.modal-body { padding:12px; overflow:auto; flex:1; }

#toTop { position:fixed; right:18px; bottom:120px; padding:8px 14px; border-radius:20px; background:#8644f1; color:#fff; display:none; z-index:9999; cursor:pointer; transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease; }
#toTop.show { display:block; }
#toTop:active { transform: scale(0.95); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); background: rgba(0,0,0,0.05); }

@media (max-width:600px){ .log-row{font-size:12px;} }

@media (prefers-color-scheme: dark){
	body { background:#0f1115; color:#e5e7eb; }
	.log-card { background:#1b1e24; border-color:#333; color:#e5e7eb; }
	.modal-content { background:#1b1e24; color:#e5e7eb; }
	.modal-header { background:#2b2e36; border-bottom-color:#444; }
	button.toggle-btn { background:#d0a026; color:#fff; }
	button.clear-log { background:#b91c1c; color:#fff; }
	button.view-json { background:#2563eb; color:#fff; }
	.modal-close { background:#393fec; color:#fff; }
}
</style>

<div id="app">
	<div class="toolbar">
		<div>
			<button type="button" class="toggle-btn" id="btnToggle">Приостановить обновление</button>
			<button type="button" class="clear-log" id="btnClear">Очистить логи</button>
		</div>
		<div style="display:flex;align-items:center;gap:12px;">
			<label>
				<select id="filterType">
					<option value="all">Все</option>
					<option value="warn">Предупреждения</option>
					<option value="err">Ошибки</option>
				</select>
			</label>
			<span>Всего записей: <span id="totalCount">0</span></span>
		</div>
	</div>

	<div id="logList"></div>
</div>

<div class="modal" id="logModal">
	<div class="modal-content">
		<div class="modal-header">
			<h3>Полный лог</h3>
			<button type="button" class="modal-close" id="btnModalClose">Закрыть</button>
		</div>
		<div class="modal-body">
			<pre id="modalJson"></pre>
		</div>
	</div>
</div>

<div id="toTop">Наверх</div>

<script>
(function() {
	'use strict';

	var MAX_RENDER = 500;

	var logs = [];
	var paused = false;
	var filterType = 'all';
	var lastRaw = '';

	var listEl = document.getElementById('logList');
	var totalEl = document.getElementById('totalCount');
	var filterEl = document.getElementById('filterType');
	var toggleEl = document.getElementById('btnToggle');
	var modalEl = document.getElementById('logModal');
	var modalPre = document.getElementById('modalJson');

	function statusClass(c) {
		c = Number(c) || 0;
		if (c >= 500) return 'err';
		if (c >= 400) return 'warn';
		return 'ok';
	}

	function el(tag, className, text) {
		var node = document.createElement(tag);
		if (className) node.className = className;
		if (text != null) node.textContent = text;
		return node;
	}

	function row(label, value) {
		var r = el('div', 'log-row');
		r.appendChild(el('span', 'label', label));
		r.appendChild(document.createTextNode(value));
		return r;
	}

	function fullUrl(l) {
		var h = (l.request && l.request.headers) || {};
		var proto = h['X-Forwarded-Proto'] ? h['X-Forwarded-Proto'][0] : 'http';
		return proto + '://' + (l.request ? ((l.request.host || '') + (l.request.uri || '')) : '-');
	}

	function realIp(l) {
		var h = (l.request && l.request.headers) || {};
		return h['Cf-Connecting-Ip'] ? h['Cf-Connecting-Ip'][0] : (l.request ? l.request.client_ip : '-');
	}

	function userAgent(l) {
		var h = (l.request && l.request.headers) || {};
		return h['User-Agent'] ? h['User-Agent'][0] : 'Неизвестно';
	}

	function buildCard(log) {
		var card = el('div', 'log-card ' + statusClass(log.status));
		var inner = el('div', 'log-inner');

		if (log.ts)
			inner.appendChild(row('Время:', new Date(log.ts * 1000).toLocaleString()));
		if (log.request)
			inner.appendChild(row('Запрос:', fullUrl(log)));
		if (log.request && log.request.method)
			inner.appendChild(row('Метод:', log.request.method));
		if (log.status)
			inner.appendChild(row('Статус:', log.status));
		if (realIp(log) !== '-')
			inner.appendChild(row('IP:', realIp(log)));
		if (userAgent(log) !== 'Неизвестно')
			inner.appendChild(row('Агент:', userAgent(log)));
		if (log.duration)
			inner.appendChild(row('Время:', (Number(log.duration) * 1000).toFixed(2) + ' мс'));

		var btnRow = el('div', 'log-row');
		var btn = el('button', 'view-json', 'Просмотреть JSON');
		btn.type = 'button';
		btn.addEventListener('click', function() { showModal(log); });
		btnRow.appendChild(btn);
		inner.appendChild(btnRow);

		card.appendChild(inner);
		return card;
	}

	function render() {
		var shown = filterType === 'all'
			? logs
			: logs.filter(function(l) { return statusClass(l.status) === filterType; });

		listEl.textContent = '';

		var limit = Math.min(shown.length, MAX_RENDER);
		for (var i = 0; i < limit; i++)
			listEl.appendChild(buildCard(shown[i]));

		if (shown.length > MAX_RENDER) {
			var note = el('div', 'log-row');
			note.style.marginTop = '12px';
			note.appendChild(el('em', null, 'Показаны последние ' + MAX_RENDER + ' записей из ' + shown.length + '.'));
			listEl.appendChild(note);
		}

		totalEl.textContent = shown.length;
	}

	function fetch() {
		if (paused || document.hidden)
			return;

		XHR.get('<%=url([[admin]], [[nas]], [[caddy]], [[get_log]])%>', null, function(x) {
			if (!x || x.status !== 200 || x.responseText == null)
				return;

			if (x.responseText === lastRaw)
				return;

			lastRaw = x.responseText;

			logs = x.responseText.split('\n').filter(Boolean).map(function(line) {
				try { return JSON.parse(line); } catch (e) { return null; }
			}).filter(Boolean).reverse();

			render();
		});
	}

	function showModal(log) {
		modalPre.textContent = JSON.stringify(log, null, 2);
		modalEl.classList.add('show');
		document.body.style.overflow = 'hidden';
	}

	function closeModal() {
		modalEl.classList.remove('show');
		document.body.style.overflow = '';
	}

	toggleEl.addEventListener('click', function() {
		paused = !paused;
		toggleEl.textContent = paused ? 'Продолжить обновление' : 'Приостановить обновление';
	});

	document.getElementById('btnClear').addEventListener('click', function() {
		XHR.get('<%=url([[admin]], [[nas]], [[caddy]], [[clear_log]])%>');
		logs = [];
		lastRaw = '';
		render();
	});

	filterEl.addEventListener('change', function() {
		filterType = filterEl.value;
		render();
	});

	document.getElementById('btnModalClose').addEventListener('click', closeModal);
	modalEl.addEventListener('click', function(ev) {
		if (ev.target === modalEl)
			closeModal();
	});

	fetch();
	setInterval(fetch, 5000);

	document.addEventListener('visibilitychange', function() {
		if (!document.hidden)
			fetch();
	});

	var topBtn = document.getElementById('toTop');
	topBtn.addEventListener('click', function() {
		window.scrollTo({ top: 0, behavior: 'smooth' });
	});
	window.addEventListener('scroll', function() {
		topBtn.classList.toggle('show', window.scrollY > 400);
	});
})();
</script>
