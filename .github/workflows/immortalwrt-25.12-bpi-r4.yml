name: immortalwrt-25.12-bpi-r4

# Сборка прошивки ImmortalWrt 25.12 для BananaPi BPI-R4 (mediatek/filogic).
# Исходный код берётся из официального репозитория ImmortalWrt, а LuCI-приложения —
# из нашего форка foric27/luci-app; готовые образы публикуются артефактом и релизом.
on:
  schedule:
    # 01:00 по Москве (UTC+3) = 22:00 UTC предыдущего дня.
    # GitHub планирует cron в UTC; запуск может задерживаться на несколько минут.
    - cron: 0 22 * * *
  workflow_dispatch:
  # push-триггер для автосборки изменений конфигурации/скриптов/патчей.
  # Автосборка при изменениях конфигурации/скриптов/патчей (API dispatch может
  # быть недоступен, а push-событие запускает workflow на стороне GitHub).
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'immortalwrt/**'
      - 'patches/**'
      - 'scripts/**'

permissions:
  actions: write
  contents: write

# Две сборки одновременно не нужны: новая отменяет предыдущую.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Исходный код прошивки
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  # Наши репозитории: конфигурация и DIY-скрипты лежат в этом репозитории,
  # LuCI-приложения — в форке foric27/luci-app
  CONFIG_FILE: immortalwrt/mediatek/defconfig-25.12
  DIY_P1_SH: immortalwrt/diy-part5.sh
  DIY_P2_SH: immortalwrt/diy-part6.sh
  LUCI_APP_REPO_URL: https://github.com/foric27/luci-app
  LUCI_APP_REPO_BRANCH: main
  # Часовой пояс для дат в именах артефактов, релизов и логах
  TZ: Europe/Moscow
  # Идентификатор сборки для кэшей, артефактов и релизов
  BUILD_ID: immortalwrt-25.12-bpi-r4
  # Каталог с готовыми файлами прошивки в дереве OpenWrt
  TARGET_BIN_DIR: bin/targets/mediatek/filogic

jobs:
  build:
    name: Сборка прошивки
    runs-on: ubuntu-26.04

    steps:
    - name: Освобождение места на диске
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'

    - name: Получение ветки проекта
      uses: actions/checkout@v6.0.2

    - name: Подготовка окружения сборки
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        ( sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex g++ gawk gcc-multilib gettext \
        git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig libpython3-dev aria2 jq subversion qemu-utils ccache rename libelf-dev
        sudo -E apt-get -qq purge azure-cli ghc* zulu* hhvm llvm* firefox powershell openjdk* dotnet* google* mysql* php* android* rename speedtest-cli
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean ) &
        sudo timedatectl set-timezone "$TZ" || true

    - name: Загрузка исходного кода прошивки
      run: |
        git clone --filter=blob:none --single-branch -c core.abbrev=7 "$REPO_URL" -b "$REPO_BRANCH" openwrt
        cd openwrt
        git log --pretty=tformat:"%h" -n1 tools toolchain || echo "Нет истории изменений tools/toolchain"

    - name: Генерация ключей кэша
      id: cache-key
      run: |
        echo "ccache_period=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

    - name: Восстановление кэша тулчейна
      uses: klever1988/cachewrtbuild@54ed4fe2f7d8b5cfbc0b928c159266ee892c2d3d
      with:
        ccache: 'false'
        prefix: ${{ github.workspace }}/openwrt
        mixkey: ${{ env.BUILD_ID }}

    - name: Восстановление кэша ccache
      id: ccache-restore
      uses: actions/cache/restore@v5.0.5
      with:
        path: openwrt/.ccache
        key: ccache-${{ env.BUILD_ID }}-${{ steps.cache-key.outputs.ccache_period }}
        restore-keys: |
          ccache-${{ env.BUILD_ID }}-

    - name: Обновление индексов базовых фидов
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a

    - name: Установка фидов и community-пакетов
      run: |
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Применение конфигурации
      run: |
        cat "$CONFIG_FILE" > openwrt/.config
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: Скачивание пакетов
      run: |
        cd openwrt
        make defconfig
        grep -qx 'CONFIG_PACKAGE_rpcd-mod-router-status=y' .config || {
          echo 'В итоговой конфигурации отсутствует независимый пакет router-status' >&2
          exit 1
        }
        make download -j"$(nproc)"
        # Удаляем недокачанные пакеты (меньше 1 КБ), чтобы они скачались заново
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Сборка прошивки
      id: compile
      run: |
        cd openwrt
        echo "Сборка в $(nproc) потоков"
        make -j"$(nproc)" || make -j"$(( $(nproc) / 2 + 1 ))" || make -j1 V=s
        CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache --show-stats
        du -sh .ccache
        echo "date1=$(date +'%Y.%m.%d')" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Сохранение ccache
      if: steps.compile.outputs.status == 'success' && steps.ccache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5.0.5
      with:
        path: openwrt/.ccache
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

    - name: Очистка старых кэшей
      if: steps.compile.outputs.status == 'success' && !cancelled()
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        CCACHE_PREFIX: ccache-${{ env.BUILD_ID }}-
        TOOLCHAIN_PREFIX: ${{ env.BUILD_ID }}-cache-openwrt-
        CURRENT_CCACHE_KEY: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          // Держим только свежие кэши: текущий ccache и самый новый кэш тулчейна,
          // остальные удаляем, чтобы не упираться в лимит хранилища Actions.
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const ccachePrefix = process.env.CCACHE_PREFIX;
          const toolchainPrefix = process.env.TOOLCHAIN_PREFIX;
          const currentCcacheKey = process.env.CURRENT_CCACHE_KEY;

          const caches = [];
          for (let page = 1; ; page += 1) {
            const response = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
              owner,
              repo,
              per_page: 100,
              page,
            });

            const pageCaches = response.data.actions_caches || [];
            caches.push(...pageCaches);
            if (pageCaches.length < 100) {
              break;
            }
          }

          const byNewest = (left, right) => {
            const leftTime = new Date(left.last_accessed_at || left.created_at || 0).getTime();
            const rightTime = new Date(right.last_accessed_at || right.created_at || 0).getTime();
            return rightTime - leftTime;
          };

          const ccacheCaches = caches
            .filter((cache) => (cache.key || '').startsWith(ccachePrefix))
            .sort(byNewest);
          const staleCcacheCaches = ccacheCaches.filter((cache) => cache.key !== currentCcacheKey);

          const toolchainCaches = caches
            .filter((cache) => (cache.key || '').startsWith(toolchainPrefix))
            .sort(byNewest);
          const staleToolchainCaches = toolchainCaches.slice(1);

          const staleCaches = [...staleCcacheCaches, ...staleToolchainCaches];
          if (staleCaches.length === 0) {
            core.info(`Устаревших кэшей нет: ${ccachePrefix}, ${toolchainPrefix}`);
            return;
          }

          core.info(`Удаление устаревших кэшей: ${staleCaches.map((cache) => cache.key).join(', ')}`);

          for (const cache of staleCaches) {
            core.info(`Удаление кэша ${cache.key} (${cache.id})`);
            await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', {
              owner,
              repo,
              cache_id: cache.id,
            });
          }

          core.info(
            `Удалено кэшей: ${staleCaches.length}. ` +
            `Оставлен ccache: ${currentCcacheKey || 'нет'}. ` +
            `Оставлен кэш тулчейна: ${toolchainCaches.length > 0 ? 'да' : 'нет'}.`
          );

    - name: Очистка старых запусков CI
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        KEEP_RUNS: '15'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          // Оставляем последние завершённые запуски этого workflow, остальные удаляем.
          const keepRuns = parseInt(process.env.KEEP_RUNS || '15', 10);
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const thisRunId = context.runId;
          // Путь workflow из GITHUB_WORKFLOW_REF (owner/repo/.github/workflows/file.yml@ref)
          const wfRef = process.env.GITHUB_WORKFLOW_REF || '';
          const wfPath = wfRef
            ? wfRef.replace(/^[^/]+\/[^/]+\//, '').replace(/@.*$/, '')
            : `.github/workflows/${context.workflow}`;

          // Получаем завершённые запуски этого workflow, начиная с самых новых.
          const runs = [];
          for (let page = 1; ; page += 1) {
            const response = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs?per_page=100&page={page}',
              { owner, repo, page }
            );
            const pageRuns = (response.data.workflow_runs || [])
              .filter((run) => run.path === wfPath && run.status === 'completed')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            runs.push(...pageRuns);
            if ((response.data.workflow_runs || []).length < 100) break;
          }

          const toDelete = runs.filter((run) => run.id !== thisRunId).slice(keepRuns);
          core.info(
            `[run-cleanup] завершённых запусков: ${runs.length}; ` +
            `оставляем ${keepRuns}, удаляем ${toDelete.length}`
          );
          for (const run of toDelete) {
            core.info(`[run-cleanup] удаление запуска ${run.id} (${run.name}) от ${run.created_at}`);
            await github.request('DELETE /repos/{owner}/{repo}/actions/runs/{run_id}', {
              owner,
              repo,
              run_id: run.id,
            });
          }

    - name: Подготовка файлов прошивки
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd "openwrt/$TARGET_BIN_DIR"
        rm -rf packages *mt798* *.config *.buildinfo *.json sha256sums
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Загрузка прошивки артефактом
      uses: actions/upload-artifact@v7.0.1
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.date1 }}_${{ env.BUILD_ID }}
        path: ${{ env.FIRMWARE }}
        retention-days: 7

    - name: Формирование тега релиза
      id: tag
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=${{ env.date1 }}-${{ env.BUILD_ID }}" >> "$GITHUB_OUTPUT"
        {
          echo "📥 Прошивка ImmortalWrt 25.12 для BananaPi BPI-R4"
          echo
          echo "- Исходный код: $REPO_URL ($REPO_BRANCH)"
          echo "- Дата сборки: $(date '+%d.%m.%Y %H:%M %Z')"
        } > release.txt
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Публикация релиза
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ${{ env.FIRMWARE }}/*
        name: ${{ steps.tag.outputs.release_tag }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt

    - name: Удаление старых релизов
      if: steps.tag.outputs.status == 'success' && !cancelled()
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        KEEP_RELEASES: '3'
        BUILD_ID: ${{ env.BUILD_ID }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          // Оставляем только последние KEEP_RELEASES релизов этой сборки,
          // старые релизы и их теги удаляем. Чужие теги не трогаем.
          const keep = parseInt(process.env.KEEP_RELEASES || '3', 10);
          const buildId = (process.env.BUILD_ID || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const tagRe = new RegExp(`^\\d{4}\\.\\d{2}\\.\\d{2}-${buildId}$`);
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          const releases = [];
          for (let page = 1; ; page += 1) {
            const response = await github.request(
              'GET /repos/{owner}/{repo}/releases?per_page=100&page={page}',
              { owner, repo, page }
            );
            const pageReleases = response.data || [];
            releases.push(...pageReleases);
            if (pageReleases.length < 100) break;
          }

          const ours = releases
            .filter((release) => tagRe.test(release.tag_name || ''))
            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
          const stale = ours.slice(keep);
          if (stale.length === 0) {
            core.info(`Старых релизов нет: всего ${ours.length}, храним ${keep}`);
            return;
          }

          for (const release of stale) {
            core.info(`Удаление релиза ${release.tag_name} (${release.id})`);
            await github.request('DELETE /repos/{owner}/{repo}/releases/{release_id}', {
              owner,
              repo,
              release_id: release.id,
            });
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${release.tag_name}`,
              });
            } catch (error) {
              core.warning(`Не удалось удалить тег ${release.tag_name}: ${error.message}`);
            }
          }

          core.info(`Удалено релизов: ${stale.length}; оставлено: ${Math.min(ours.length, keep)}`);
